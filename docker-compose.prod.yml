# Production example (single server). Put real values in .env.production next to
# this file (never commit it) and run:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Put a TLS-terminating proxy (Caddy, Cloudflare Tunnel, a load balancer) in front of
# `web` on port 80. Only `web` is exposed; db, api, file and report stay private.

name: cambo-supply

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cambo_supply
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d cambo_supply']
      interval: 10s
      retries: 10

  file:
    build: { context: ., dockerfile: docker/file.Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FILE_SERVICE_SECRET: ${FILE_SERVICE_SECRET}
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes: [uploads:/data/uploads]

  report:
    build: { context: ., dockerfile: docker/report.Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Read-only login created with report/sql/readonly-role.sql
      REPORT_DATABASE_URL: postgresql://cambo_report_login:${REPORT_DB_PASSWORD}@db:5432/cambo_supply
      REPORT_SERVICE_SECRET: ${REPORT_SERVICE_SECRET}
      STORE_NAME: ${STORE_NAME:-Cambo Supply}
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/cambo_supply
      WEB_ORIGIN: ${PUBLIC_ORIGIN}
      TRUST_PROXY: 'true'
      FILE_SERVICE_URL: http://file:4100
      FILE_SERVICE_SECRET: ${FILE_SERVICE_SECRET}
      PUBLIC_FILES_URL: ${PUBLIC_ORIGIN}/files
      REPORT_SERVICE_URL: http://report:4200
      REPORT_SERVICE_SECRET: ${REPORT_SERVICE_SECRET}
      TELEGRAM_MODE: webhook
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      TELEGRAM_WEBHOOK_URL: ${PUBLIC_ORIGIN}/api/v1/telegram/webhook
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args: { VITE_TELEGRAM_BOT_USERNAME: '${TELEGRAM_BOT_USERNAME}' }
    restart: unless-stopped
    ports: ['80:80']
    depends_on: [api, file]

volumes:
  db-data:
  uploads:
