name: CI

# Pull requests: test and build every image (nothing is published).
# Pushes to main and version tags (v1.2.3): the same, then publish the images to GitHub Container Registry.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cambo_supply_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
      # The cache and rate-limiter tests that need a real Redis run against this one.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      # One database per service, as in production. The tests create the extra ones themselves.
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/cambo_supply_test
      FILE_DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/cambo_file_test
      REPORT_DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/cambo_report_test
      NOTIFICATION_DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/cambo_notification_test
      DATABASE_URL_TEST_KIT: postgresql://postgres:postgres@localhost:5432/cambo_kit_test
      REDIS_URL_TEST: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema api/prisma/schema.prisma
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test --workspace shared
      - run: npm test --workspace service-kit
      - run: npm test --workspace api
      - run: npm test --workspace file
      - run: npm test --workspace report
      - run: npm test --workspace notification
      - run: npm test --workspace web
      - run: npm run test:scripts
      - run: npm run build

  images:
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, file, report, notification, web]
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name (lower case, as GHCR requires)
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/cambokb-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            VITE_SITE_URL=${{ vars.PUBLIC_ORIGIN }}
            VITE_TELEGRAM_BOT_USERNAME=${{ vars.TELEGRAM_BOT_USERNAME }}

  smoke:
    name: Whole stack in Docker Compose
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start every service, its database and the monitoring
        run: docker compose --profile observability up -d --build --wait --wait-timeout 600
      - name: Smoke test
        run: scripts/smoke.sh
      - name: Logs (when something failed)
        if: failure()
        run: docker compose --profile observability logs --no-color --tail 200
      - name: Stop
        if: always()
        run: docker compose --profile observability down -v

  # The verdict, posted to the Telegram "Pipeline" topic. Runs even when something above failed.
  # A run replaced by a newer push (cancelled) stays silent. See scripts/pipeline-notify.mjs.
  notify:
    name: Telegram notice
    runs-on: ubuntu-latest
    needs: [test, images, smoke]
    if: ${{ always() }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/pipeline-notify.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/pipeline-notify.mjs run
        env:
          RUN_TITLE: CI
          RUN_RESULTS: ${{ toJSON(needs) }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PIPELINE_THREAD_ID: ${{ vars.TELEGRAM_PIPELINE_THREAD_ID }}
