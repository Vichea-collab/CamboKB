name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cambo_supply_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/cambo_supply_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema api/prisma/schema.prisma
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test --workspace shared
      - run: npm test --workspace api
      - run: npm test --workspace file
      - run: npm test --workspace report
      - run: npm test --workspace web
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [api, file, report, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
