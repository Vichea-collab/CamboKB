name: Deploy

# Runs by itself after CI passes on a push to main: the server updates itself to exactly the commit CI just tested,
# checks the shop, and goes back to the previous version if a check fails (scripts/server-deploy.sh does the work on the
# server). It does nothing until the repository variable DEPLOY_ENABLED is `true`. Start it by hand (Actions -> Deploy
# -> Run workflow) to deploy or go back to any commit of main.
#
# What it needs, once (docs/deployment.md, "Automatic deploys"):
#   - repository variable  DEPLOY_ENABLED = true, PUBLIC_HOST = the shop's host name (for the notice)
#   - repository secrets   DEPLOY_HOST (the server), DEPLOY_KNOWN_HOSTS (its SSH identity), DEPLOY_SSH_KEY (a key
#     that the server accepts for nothing but "deploy <commit>")

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full commit id of main to run (40 characters). Empty: the newest commit of main'
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # After CI: only after a successful push to main when GitHub Actions owns releases. By hand: always.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      vars.JENKINS_RELEASE_ENABLED != 'true' &&
      vars.DEPLOY_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    environment: production
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    # Nothing of this repository is needed here: the server fetches the commit itself.
    permissions: {}
    timeout-minutes: 30
    steps:
      - name: Which commit
        id: tag
        env:
          TYPED: ${{ inputs.commit }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          sha="${TYPED:-$SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Not a full commit id"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${sha:0:7}" >> "$GITHUB_OUTPUT"
      - name: Ask the server to update itself
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          COMMIT: ${{ steps.tag.outputs.sha }}
        run: |
          [ -n "$HOST" ] && [ -n "$KNOWN_HOSTS" ] && [ -n "$KEY" ] || { echo "Missing a secret: see the top of this workflow"; exit 1; }
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$KEY" > ~/.ssh/deploy; printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts)
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 -o ServerAliveInterval=20 "deploy@$HOST" "deploy $COMMIT"

  notify:
    name: Telegram notice
    runs-on: ubuntu-latest
    needs: deploy
    # No message when the deploy was skipped (CI failed, or no server set up).
    if: ${{ always() && needs.deploy.result != 'skipped' }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/pipeline-notify.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/pipeline-notify.mjs run
        env:
          RUN_TITLE: Deploy
          RUN_RESULTS: ${{ toJSON(needs) }}
          RUN_NOTE: Image tag ${{ needs.deploy.outputs.tag }} on ${{ vars.PUBLIC_HOST }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PIPELINE_THREAD_ID: ${{ vars.TELEGRAM_PIPELINE_THREAD_ID }}
