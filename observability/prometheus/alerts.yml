# Alert rules. They show in Prometheus (Alerts tab) and in Grafana. Connect Alertmanager later to be messaged.
groups:
  - name: availability
    rules:
      - alert: ServiceDown
        expr: up{job=~"api|file|report|notification"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }} for 1 minute."

  - name: requests
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
            / sum by (service) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }}: more than 5% of requests fail"
      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }}: 95% of requests take longer than 1 second"

  - name: service-communication
    rules:
      - alert: EventsBacklog
        expr: service_events_oldest_pending_age_seconds > 300
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "The api cannot deliver events to {{ $labels.target }}"
          description: "The oldest event has waited more than 5 minutes. Nothing is lost: it is retried until it works."
      - alert: EventsGivenUp
        expr: service_events_failed > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Events for {{ $labels.target }} were given up on"
          description: "Fix the cause, then run: npm run events:prod retry-failed (in the api container)."
      - alert: TelegramBacklog
        expr: notification_outbox_oldest_pending_age_seconds > 300
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Telegram messages have been waiting more than 5 minutes"
      - alert: TelegramMessagesFailing
        expr: notification_outbox_failed > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Some Telegram messages were given up on (blocked users, bad chat id?)"

  - name: resources
    rules:
      - alert: ContainerMemoryHigh
        expr: |
          container_memory_working_set_bytes{container_label_com_docker_compose_project!="", name!=""}
            / (container_spec_memory_limit_bytes > 0) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.name }} uses more than 90% of its memory limit"
