server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 50m;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  # API (the only service the browser calls for data).
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
  }

  # Product and banner images (only the public /files path of the file service).
  location /files/ {
    proxy_pass http://file:4100;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Hashed build assets never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths load index.html (never cached).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
